services:
  - type: web
    name: ai-career-mentor-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python train_models.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENROUTER_API_KEY
        sync: false
